name: Cloud Build Self-Contained EXE
on:
workflow_dispatch: # Allows you to manually click a button to start the build
jobs:
build:
runs-on: windows-latest
steps:
name: Checkout Code
uses: actions/checkout@v4
with:
submodules: recursive # Crucial for projects like RiftStrap that use submodules
name: Setup .NET SDK
uses: actions/setup-dotnet@v4
with:
dotnet-version: '8.0.x' # RiftStrap relies on the .NET 8 runtime environment
name: Compile & Embed Runtime
run: |
dotnet publish RiftStrap/RiftStrap.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfContained=true -o ./compiled_output
name: Package Output EXE
uses: actions/upload-artifact@v4
with:
name: RiftStrap-Embedded-Windows
path: ./compiled_output/

jobs:
  build:
    runs-on: windows-latest
    # the release step needs write access to create the release and upload the exe;
    # without it GITHUB_TOKEN is read-only and the upload fails with 403.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore RiftStrap.sln

      - name: Build
        run: dotnet build RiftStrap.sln -c Release --no-restore -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }}

      - name: Publish
        run: dotnet publish RiftStrap/RiftStrap.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiftStrap-x64
          path: publish/RiftStrap.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/RiftStrap.exe
          generate_release_notes: true
