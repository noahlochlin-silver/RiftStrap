actions/setup-dotnet@v4
with:
dotnet-version: '8.0.x'
name: Compile Application
run: dotnet publish RiftStrap/RiftStrap.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfContained=true -o ./compiled_output
name: Package Output EXE
uses: actions/upload-artifact@v4
with:
name: RiftStrap-Embedded-Windows
path: ./compiled_output/

